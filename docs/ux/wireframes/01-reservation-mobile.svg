<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <title>Wireframe basse fidélité : réservation publique mobile en 3 étapes</title>
  <style>
    .phone{fill:#fff;stroke:#333;stroke-width:2}
    .box{fill:#f1f1f1;stroke:#999}
    .sel{fill:#e3eef6;stroke:#0b5c8a;stroke-width:2}
    .btn{fill:#0b5c8a}
    .btnt{fill:#fff;font-weight:600}
    .ghost{fill:#fff;stroke:#555}
    .h{font-weight:700;font-size:15px}
    .note{fill:#b42318;font-size:12px}
    .muted{fill:#666;font-size:12px}
  </style>
  <rect width="1180" height="760" fill="#fafafa"/>
  <text x="20" y="30" class="h" font-size="18">Kalendo · Réservation publique · mobile 390 px (wireframe v2, après itérations)</text>

  <!-- Écran 1 -->
  <g transform="translate(20,50)">
    <rect class="phone" width="260" height="560" rx="24"/>
    <rect x="12" y="16" width="236" height="30" class="box"/><text x="20" y="36">Kalendo        FR EN ع  ☾</text>
    <text x="16" y="72" class="muted">Prise de rendez-vous en ligne</text>
    <text x="16" y="94" class="h">Cabinet Kiné Les Tilleuls</text>
    <g transform="translate(16,110)">
      <rect width="72" height="6" fill="#0b5c8a"/><rect x="80" width="72" height="6" fill="#ccc"/><rect x="160" width="68" height="6" fill="#ccc"/>
      <text y="22" font-size="11">1 Prestation</text><text x="80" y="22" font-size="11" fill="#666">2 Créneau</text><text x="160" y="22" font-size="11" fill="#666">3 Coord.</text>
    </g>
    <text x="16" y="168" class="h">Prestation</text>
    <rect x="16" y="178" width="228" height="48" class="sel" rx="6"/><text x="26" y="198">◉ Séance de kiné</text><text x="26" y="216" class="muted">30 min</text><text x="190" y="206">35 €</text>
    <rect x="16" y="232" width="228" height="48" class="box" rx="6"/><text x="26" y="252">○ Bilan initial</text><text x="26" y="270" class="muted">45 min</text><text x="190" y="260">50 €</text>
    <rect x="16" y="286" width="228" height="48" class="box" rx="6"/><text x="26" y="314">○ Drainage …</text><text x="190" y="314">60 €</text>
    <text x="16" y="362" class="h">Praticien</text>
    <rect x="16" y="372" width="228" height="40" class="sel" rx="6"/><text x="26" y="397">◉ Claire Martin</text>
    <rect x="16" y="418" width="228" height="40" class="box" rx="6"/><text x="26" y="443">○ Youssef Benali</text>
    <rect x="16" y="490" width="228" height="44" class="btn" rx="6"/><text x="98" y="517" class="btnt">Continuer</text>
  </g>
  <text x="20" y="635" class="note">① Radios natives dans fieldset/legend :</text>
  <text x="20" y="651" class="note">   clavier (flèches) + lecteur d'écran.</text>
  <text x="20" y="667" class="note">② Bouton pleine largeur, zone tactile ≥ 44 px.</text>

  <!-- Écran 2 -->
  <g transform="translate(320,50)">
    <rect class="phone" width="260" height="560" rx="24"/>
    <rect x="12" y="16" width="236" height="30" class="box"/><text x="20" y="36">Kalendo        FR EN ع  ☾</text>
    <g transform="translate(16,70)">
      <rect width="72" height="6" fill="#0b5c8a"/><rect x="80" width="72" height="6" fill="#0b5c8a"/><rect x="160" width="68" height="6" fill="#ccc"/>
      <text y="22" font-size="11">1 ✓</text><text x="80" y="22" font-size="11" font-weight="700">2 Créneau</text><text x="160" y="22" font-size="11" fill="#666">3 Coord.</text>
    </g>
    <text x="16" y="128" class="h">Choisissez un créneau  ← focus</text>
    <text x="16" y="148" class="muted">Heure du cabinet (Europe/Paris)</text>
    <g transform="translate(16,160)">
      <rect width="64" height="48" class="sel" rx="6"/><text x="10" y="20" font-size="11">lun. 26</text><text x="8" y="38" font-size="10">12 créneaux</text>
      <rect x="70" width="64" height="48" class="box" rx="6"/><text x="80" y="20" font-size="11">mar. 27</text><text x="80" y="38" font-size="10">8 créneaux</text>
      <rect x="140" width="64" height="48" class="box" rx="6" opacity=".5"/><text x="150" y="20" font-size="11">mer. 28</text><text x="150" y="38" font-size="10">complet</text>
      <text x="210" y="30">→</text>
    </g>
    <g transform="translate(16,226)">
      <rect width="70" height="36" class="ghost" rx="6"/><text x="18" y="23">09:00</text>
      <rect x="79" width="70" height="36" class="btn" rx="6"/><text x="97" y="23" class="btnt">09:15</text>
      <rect x="158" width="70" height="36" class="ghost" rx="6"/><text x="176" y="23">09:30</text>
      <rect y="44" width="70" height="36" class="ghost" rx="6"/><text x="18" y="67">10:15</text>
      <rect x="79" y="44" width="70" height="36" class="ghost" rx="6"/><text x="97" y="67">10:30</text>
      <rect x="158" y="44" width="70" height="36" class="ghost" rx="6"/><text x="176" y="67">14:00</text>
    </g>
    <rect x="16" y="440" width="228" height="44" class="btn" rx="6"/><text x="98" y="467" class="btnt">Continuer</text>
    <rect x="16" y="492" width="228" height="44" class="ghost" rx="6"/><text x="106" y="519">Retour</text>
  </g>
  <text x="320" y="635" class="note">③ Jours en défilement horizontal, jours complets</text>
  <text x="320" y="651" class="note">   désactivés (pas de clic « pour rien »).</text>
  <text x="320" y="667" class="note">④ aria-pressed sur jour et heure sélectionnés.</text>
  <text x="320" y="683" class="note">⑤ Action principale au-dessus de « Retour » sur mobile.</text>

  <!-- Écran 3 -->
  <g transform="translate(620,50)">
    <rect class="phone" width="260" height="560" rx="24"/>
    <rect x="12" y="16" width="236" height="30" class="box"/><text x="20" y="36">Kalendo        FR EN ع  ☾</text>
    <text x="16" y="84" class="h">Vos coordonnées</text>
    <rect x="16" y="96" width="228" height="70" class="box" rx="6"/>
    <text x="26" y="116" font-size="12">Prestation : Séance (35 €)</text><text x="26" y="134" font-size="12">Praticien : Claire Martin</text><text x="26" y="152" font-size="12">Date : lundi 26 oct. – 09:15</text>
    <text x="16" y="192">Nom et prénom *</text><rect x="16" y="198" width="228" height="36" class="ghost" rx="4"/>
    <text x="16" y="256">Adresse e-mail *</text><rect x="16" y="262" width="228" height="36" class="ghost" rx="4"/>
    <text x="16" y="314" class="muted">Un rappel vous sera envoyé la veille.</text>
    <text x="16" y="340">Téléphone (facultatif)</text><rect x="16" y="346" width="228" height="36" class="ghost" rx="4"/>
    <rect x="16" y="440" width="228" height="44" class="btn" rx="6"/><text x="44" y="467" class="btnt">Confirmer le rendez-vous</text>
    <rect x="16" y="492" width="228" height="44" class="ghost" rx="6"/><text x="106" y="519">Retour</text>
  </g>
  <text x="620" y="635" class="note">⑥ Récapitulatif avant saisie : on ne perd pas le contexte.</text>
  <text x="620" y="651" class="note">⑦ 2 champs obligatoires seulement, pas de compte.</text>
  <text x="620" y="667" class="note">⑧ Téléphone en dir="ltr" même en arabe.</text>

  <!-- Écran 4 : RTL -->
  <g transform="translate(920,50)">
    <rect class="phone" width="240" height="560" rx="24"/>
    <rect x="12" y="16" width="216" height="30" class="box"/><text x="220" y="36" text-anchor="end">☾  FR EN ع        Kalendo</text>
    <text x="220" y="84" class="h" text-anchor="end">تم تأكيد الموعد ✓</text>
    <rect x="16" y="100" width="208" height="90" class="box" rx="6"/>
    <text x="214" y="124" text-anchor="end" font-size="12">جلسة علاج طبيعي</text>
    <text x="214" y="144" text-anchor="end" font-size="12">مع Claire Martin</text>
    <text x="214" y="164" text-anchor="end" font-size="12">الاثنين 26 أكتوبر – 09:15</text>
    <rect x="16" y="210" width="208" height="40" class="ghost" rx="6"/><text x="120" y="235" text-anchor="middle">حجز موعد آخر</text>
  </g>
  <text x="920" y="635" class="note">⑨ Version arabe : &lt;html dir="rtl"&gt;, propriétés</text>
  <text x="920" y="651" class="note">   logiques Tailwind (ps-/ms-/start-) : le</text>
  <text x="920" y="667" class="note">   miroir est automatique, sans CSS dédié.</text>
  <text x="20" y="730" class="muted">Légende : rectangles gris = contenu, bleu = sélection / action principale. Wireframe réalisé en SVG à la place d'une maquette Figma (voir README).</text>
</svg>
